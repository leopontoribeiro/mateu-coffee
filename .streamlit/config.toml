[theme]
base = "light"
backgroundColor = "#F6F3EE"
secondaryBackgroundColor = "#FFFFFF"
primaryColor = "#D97732"
textColor = "#1C1714"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "viewer"

[server]
headless = true
# Limites de WebSocket e upload (RangeError fix)
maxMessageSize = 200
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false
